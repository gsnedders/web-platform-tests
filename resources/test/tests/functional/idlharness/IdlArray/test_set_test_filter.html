<p>Verify the series of sub-tests that are executed when a test filter is set
with set_test_filter().</p>
<script>
"use strict";

// Excluding one member keeps the interface and its other members
(() => {
  Object.defineProperty(window, "A", {
    enumerable: false,
    writable: true,
    configurable: true,
    value: function A() {
      throw new TypeError("Illegal constructor");
    }
  });
  A.prototype.keep = function keep() {
    throw new TypeError("Illegal invocation");
  };
  Object.defineProperty(A, "prototype", { writable: false });

  const idlArray = new IdlArray();
  idlArray.add_idls(`
    [Exposed=Window] interface A {
      undefined keep();
      undefined exclude();
    };`);
  idlArray.set_test_filter((name, member) => member !== "exclude");
  idlArray.test();
})();

// A member can be included without its interface's checks
(() => {
  Object.defineProperty(window, "B", {
    enumerable: false,
    writable: true,
    configurable: true,
    value: function B() {
      throw new TypeError("Illegal constructor");
    }
  });
  B.prototype.keep = function keep() {
    throw new TypeError("Illegal invocation");
  };
  Object.defineProperty(B, "prototype", { writable: false });

  const idlArray = new IdlArray();
  idlArray.add_idls(`
    [Exposed=Window] interface B {
      undefined keep();
      undefined exclude();
    };
    [Exposed=Window] interface C {
      undefined exclude();
    };`);
  idlArray.set_test_filter((name, member) => name === "B" && member === "keep");
  idlArray.test();
})();

// Members added by partial interfaces and mixins are filtered
(() => {
  Object.defineProperty(window, "D", {
    enumerable: false,
    writable: true,
    configurable: true,
    value: function D() {
      throw new TypeError("Illegal constructor");
    }
  });
  D.prototype.keep = function keep() {
    throw new TypeError("Illegal invocation");
  };
  Object.defineProperty(D, "prototype", { writable: false });

  const idlArray = new IdlArray();
  idlArray.add_idls(`
    [Exposed=Window] interface D { undefined keep(); };
    partial interface D { undefined partialMember(); };
    interface mixin M { undefined mixinMember(); };
    D includes M;`);
  idlArray.set_test_filter((name, member) =>
    member !== "partialMember" && member !== "mixinMember");
  idlArray.test();
})();

// Including everything doesn't enable untested dependencies
(() => {
  Object.defineProperty(window, "E", {
    enumerable: false,
    writable: true,
    configurable: true,
    value: function E() {
      throw new TypeError("Illegal constructor");
    }
  });
  Object.defineProperty(window, "F", {
    enumerable: false,
    writable: true,
    configurable: true,
    value: function F() {
      throw new TypeError("Illegal constructor");
    }
  });
  Object.setPrototypeOf(F, E);
  Object.setPrototypeOf(F.prototype, E.prototype);
  F.prototype.child = function child() {
    throw new TypeError("Illegal invocation");
  };
  Object.defineProperty(E, "prototype", { writable: false });
  Object.defineProperty(F, "prototype", { writable: false });

  const idlArray = new IdlArray();
  idlArray.add_untested_idls(`
    [Exposed=Window] interface E { undefined parent(); };`);
  idlArray.add_idls(`
    [Exposed=Window] interface F : E { undefined child(); };`);
  idlArray.set_test_filter(() => true);
  idlArray.test();
})();
</script>
